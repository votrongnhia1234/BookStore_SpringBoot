<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browse Books - BookStore</title>
    <th:block th:replace="~{layout::link-css}"></th:block>
    <th:block th:replace="~{layout::custom-css}"></th:block>
    <style>
        .books-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 2rem 0;
            flex-wrap: wrap;
            gap: 1rem;
        }
        
        .books-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1f2937;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
            max-width: 400px;
            display: flex;
            gap: 0.5rem;
        }
        
        .table-wrapper {
            background: white;
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        
        @media (max-width: 768px) {
            .books-header {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <th:block th:replace="~{layout::header}"></th:block>
    
    <main class="container">
        <div class="books-header">
            <h1>📚 Our Books</h1>
            <form class="search-box" th:action="@{/books/search}" method="get">
                <input class="form-control" type="search" placeholder="Search by title or author..." name="keyword">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>

        <div class="table-wrapper">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 5%"><a th:href="@{/books(pageNo=${currentPage}, sortBy='id')}">ID</a></th>
                        <th style="width: 25%"><a th:href="@{/books(pageNo=${currentPage}, sortBy='title')}">Title</a></th>
                        <th style="width: 20%"><a th:href="@{/books(pageNo=${currentPage}, sortBy='author')}">Author</a></th>
                        <th style="width: 12%"><a th:href="@{/books(pageNo=${currentPage}, sortBy='price')}">Price</a></th>
                        <th style="width: 15%"><a th:href="@{/books(pageNo=${currentPage}, sortBy='category')}">Category</a></th>
                        <th style="width: 23%">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.getId()}"></td>
                        <td th:text="${book.getTitle()}"></td>
                        <td th:text="${book.getAuthor()}"></td>
                        <td><strong th:text="${'$' + book.getPrice()}"></strong></td>
                        <td th:text="${book.getCategory().getName()}"></td>
                        <td>
                            <a class="btn btn-primary" sec:authorize="hasAnyAuthority('ADMIN')"
                                th:href="@{/books/edit/{id}(id=${book.getId()})}">Edit</a>
                            <a class="btn btn-danger" sec:authorize="hasAnyAuthority('ADMIN')"
                                th:href="@{/books/delete/{id}(id=${book.getId()})}"
                                onclick="return confirm('Are you sure?')">Delete</a>
                            <form th:action="@{/books/add-to-cart}" method="post" class="d-inline">
                                <input type="hidden" name="id" th:value="${book.getId()}">
                                <input type="hidden" name="name" th:value="${book.getTitle()}">
                                <input type="hidden" name="price" th:value="${book.getPrice()}">
                                <button type="submit" class="btn btn-success"
                                    onclick="return confirm('Add to cart?')">Add to Cart</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav aria-label="Pagination" class="mt-4">
            <ul class="pagination">
                <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages)}">
                    <a class="page-link" th:classappend="${currentPage == i} ? 'active'" 
                       th:href="@{/books(pageNo=${i})}" th:text="${i + 1}"></a>
                </li>
            </ul>
        </nav>
    </main>

    <th:block th:replace="~{layout::footer}"></th:block>
</body>

</html>
