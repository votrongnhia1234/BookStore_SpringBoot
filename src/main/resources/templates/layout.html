<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookStore</title>
  <link th:fragment="link-css" rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
  <link th:fragment="custom-css" rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
  <header th:fragment="header">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand" href="/">📚 BookStore</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
          aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="/">Home</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','USER')">
              <a class="nav-link" href="/books">Books</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN')">
              <a class="nav-link" href="/books/add">Add Book</a>
            </li>
            <li class="nav-item" sec:authorize="hasAnyAuthority('ADMIN','USER')">
              <a class="nav-link" href="/cart">Cart</a>
            </li>
            <li class="nav-item" sec:authorize="isAuthenticated()">
              <form th:action="@{/logout}" method="post" class="d-inline">
                <button class="btn btn-outline-danger" type="submit">Logout</button>
              </form>
            </li>
            <li class="nav-item" sec:authorize="!isAuthenticated()">
              <a class="btn btn-primary" href="/login">Login</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
  
  <main class="container">
    <div th:fragment="content"></div>
  </main>
  
  <footer th:fragment="footer" class="footer">
    <div class="container">
      <p>&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> 
        <a href="https://www.hutech.edu.vn/">HUTECH BookStore</a>. All rights reserved.</p>
    </div>
    <script th:src="@{/js/bootstrap.min.js}"></script>
    <script th:src="@{/js/jquery-3.7.0.min.js}"></script>
  </footer>
</body>

</html>
