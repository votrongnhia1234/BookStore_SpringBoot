<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BookStore</title>
    <th:block th:replace="~{layout :: link-css}"></th:block>
    <th:block th:replace="~{layout::custom-css}"></th:block>
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 200px);
            padding: 2rem 0;
        }
        
        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        
        .login-card h2 {
            font-size: 1.875rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 0.5rem;
            text-align: center;
        }
        
        .login-card .subtitle {
            color: #6b7280;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #d1d5db;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background-color: #e5e7eb;
        }
        
        .divider span {
            margin: 0 1rem;
            font-size: 0.875rem;
            color: #9ca3af;
        }
        
        .oauth-button {
            display: block;
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            text-align: center;
            border-radius: 0.5rem;
            background: #f3f4f6;
            border: 1px solid #e5e7eb;
            text-decoration: none;
            color: #1f2937;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .oauth-button:hover {
            background: #e5e7eb;
            color: #1f2937;
            text-decoration: none;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: #1f2937;
        }
        
        .form-control {
            width: 100%;
        }
        
        .remember-checkbox {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        
        .remember-checkbox input[type="checkbox"] {
            margin-right: 0.5rem;
        }
        
        .login-btn {
            width: 100%;
            padding: 0.75rem;
            font-weight: 600;
        }
        
        .signup-link {
            text-align: center;
            margin-top: 1.5rem;
            color: #6b7280;
        }
        
        .signup-link a {
            color: #dc2626;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }
        
        .signup-link a:hover {
            color: #991b1b;
        }
        
        .alert {
            margin-bottom: 1.5rem;
        }
    </style>
</head>

<body>
    <th:block th:replace="~{layout :: header}"></th:block>
    
    <main class="login-container">
        <div class="login-card">
            <h2>Welcome Back</h2>
            <p class="subtitle">Sign in to your BookStore account</p>

            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                ❌ Invalid username or password. Please try again.
            </div>

            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                ✅ You have been successfully logged out.
            </div>

            <a href="/oauth2/authorization/google" class="oauth-button">
                🔐 Login with Google
            </a>

            <div class="divider">
                <span>OR</span>
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" 
                        placeholder="Enter your username" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password"
                        placeholder="Enter your password" required>
                </div>

                <div class="remember-checkbox">
                    <input type="checkbox" id="remember-me" name="remember_me">
                    <label for="remember-me" style="margin-bottom: 0;">Remember me</label>
                </div>

                <button type="submit" class="btn btn-primary login-btn">Sign In</button>
            </form>

            <div class="signup-link">
                Don't have an account? <a th:href="@{/register}">Sign up here</a>
            </div>
        </div>
    </main>

    <th:block th:replace="~{layout :: footer}"></th:block>
</body>

</html>
